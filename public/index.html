<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emkwen Vocational Training Centre - Admission Forms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f9f9f9;
    }
    h1 {
      color: #8fd3ff;
    }
    #courseSearch {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    ul#admissionList {
      list-style: none;
      padding-left: 0;
      max-width: 600px;
    }
    ul#admissionList li {
      background: white;
      margin-bottom: 12px;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    ul#admissionList li a.download-link {
      font-weight: bold;
      color: #007bff;
      text-decoration: none;
    }
    ul#admissionList li a.download-link:hover {
      text-decoration: underline;
    }
    .course-name {
      font-style: italic;
      color: #555;
      margin-top: 5px;
    }
    #searchCount {
      margin-bottom: 15px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Admission Forms</h1>
  <input
    type="text"
    id="courseSearch"
    placeholder="Search admission forms by course name..."
    autocomplete="off"
  />
  <div id="searchCount">Loading admission forms...</div>
  <ul id="admissionList"></ul>

  <script>
    const admissionForms = [
      { filename: 'ICT ADMISSION FORM.pdf', course: 'ICT / Computer Packages' },
      { filename: 'I.C.T DEPARTMENT (1).pdf', course: 'ICT / Computer Packages' },
      { filename: 'ELECTRICAL INSTALLATION ADMISSION FORM (1) (7).pdf', course: 'Electrical Installation' },
      { filename: 'MASONRY_ADMISSION_FORM_(1)[1] (1).pdf', course: 'Masonry' },
      { filename: 'CARPENTRY&J DEPARTMENT.pdf', course: 'Carpentry and Joinery' },
      { filename: 'm.v.m adm form (2).pdf', course: 'Motor Vehicle Mechanics' },
      { filename: 'FOOD & BEVERAGE (2).pdf', course: 'Food and Beverage' },
      { filename: 'KNITTING COURSE (2).pdf', course: 'Knitting' }
    ];

    function fetchAdmissionForms(course = '') {
      const searchTerm = course.toLowerCase();
      const forms = admissionForms.filter(form =>
        form.course.toLowerCase().includes(searchTerm)
      );
      const admissionList = document.getElementById('admissionList');
      admissionList.innerHTML = '';

      if (forms.length === 0) {
        admissionList.innerHTML = '<li>No admission forms found.</li>';
      } else {
        forms.forEach(form => {
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = '../PDF/' + encodeURIComponent(form.filename);
          link.download = form.filename;
          link.className = 'download-link';
          link.textContent = `${form.course} - ${form.filename}`;
          li.appendChild(link);

          const courseName = document.createElement('div');
          courseName.className = 'course-name';
          courseName.textContent = `Course: ${form.course}`;
          li.appendChild(courseName);
          admissionList.appendChild(li);
        });
      }

      document.getElementById('searchCount').textContent = `Showing ${forms.length} admission form(s)${course ? ' for "' + course + '"' : ''}`;
    }

    const searchInput = document.getElementById('courseSearch');
    searchInput.addEventListener('input', () => {
      fetchAdmissionForms(searchInput.value.trim());
    });

    // Initial load
    fetchAdmissionForms();
  </script>
</body>
</html>
